<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Upload spike</title>
<style>body{font-family:Inter,system-ui,sans-serif;background:#080C0F;color:#EAF0F3;padding:20px;max-width:560px;margin:0 auto}button,select{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #1A2028;background:#2FC04B;color:#06120a;font-weight:700;margin:6px 0}select{background:#111820;color:#EAF0F3}label{display:block;margin:12px 0 4px;color:#6E8898;font-size:13px}pre{white-space:pre-wrap;background:#0D1217;border:1px solid #1A2028;border-radius:10px;padding:12px;font-size:13px;min-height:80px}.bar{height:8px;background:#111820;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2FC04B}</style></head>
<body>
<h2>Content Hub: upload spike</h2>
<p style="color:#6E8898;font-size:14px">Go/no-go test for browser to Drive upload. Run it on your phone (Safari) and on the Mac (Chrome). It writes one real file into <b>03 Raw Footage / _spike</b>. Delete that folder afterwards.</p>
<label>Scope to test</label>
<select id="scope"><option value="https://www.googleapis.com/auth/drive.file">drive.file (narrow, preferred)</option><option value="https://www.googleapis.com/auth/drive">drive (full)</option></select>
<label>Step 1</label><button onclick="auth()">Grant Drive access</button>
<label>Step 2</label><input id="f" type="file" accept="video/*,image/*"><button onclick="go()">Upload the file</button>
<div class="bar"><i id="bar"></i></div>
<pre id="log">Waiting.</pre>
<script src="app-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var token=null;function log(s){var l=document.getElementById("log");l.textContent+="\n"+s;console.log(s);}
function auth(){
  if(!window.HUB_CONFIG.googleClientId)return log("FAIL: googleClientId is null in app-config.js.");
  var tc=google.accounts.oauth2.initTokenClient({client_id:HUB_CONFIG.googleClientId,scope:document.getElementById("scope").value,callback:function(r){if(r.access_token){token=r.access_token;log("OK: token granted, scope "+r.scope);}else log("FAIL: "+JSON.stringify(r));},error_callback:function(e){log("FAIL: "+JSON.stringify(e));}});
  tc.requestAccessToken({prompt:"consent"});
}
async function go(){
  var f=document.getElementById("f").files[0];if(!f)return log("Pick a file first.");if(!token)return log("Grant access first.");
  var H={Authorization:"Bearer "+token,"Content-Type":"application/json"};
  try{
    log("1. Creating folder _spike under 03 Raw Footage ("+HUB_CONFIG.drive.raw+")");
    var r=await fetch("https://www.googleapis.com/drive/v3/files?supportsAllDrives=true&fields=id,webViewLink",{method:"POST",headers:H,body:JSON.stringify({name:"_spike",mimeType:"application/vnd.google-apps.folder",parents:[HUB_CONFIG.drive.raw]})});
    var t=await r.text();log("   HTTP "+r.status+" "+t.slice(0,200));if(!r.ok)return log("FAIL at folder create. If this is 404 'File not found' under drive.file, switch the scope to drive and retry.");
    var folder=JSON.parse(t).id;
    log("2. Starting resumable session for "+f.name+" ("+f.size+" bytes)");
    var s=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true&fields=id,name,size,webViewLink",{method:"POST",headers:Object.assign({},H,{"X-Upload-Content-Type":f.type||"application/octet-stream","X-Upload-Content-Length":String(f.size)}),body:JSON.stringify({name:"spike__"+f.name,parents:[folder]})});
    log("   HTTP "+s.status+"; Location header "+(s.headers.get("Location")?"PRESENT":"MISSING (CORS exposure problem)"));
    var loc=s.headers.get("Location");if(!loc)return log("FAIL: no Location header.");
    var CH=8*1024*1024,off=0,res,out;
    while(off<f.size){var end=Math.min(off+CH,f.size);res=await fetch(loc,{method:"PUT",headers:{"Content-Range":"bytes "+off+"-"+(end-1)+"/"+f.size},body:f.slice(off,end)});
      if(res.status===308){var rg=res.headers.get("Range");off=rg?parseInt(rg.split("-")[1],10)+1:end;log("   chunk ok, Range header "+(rg?rg:"not exposed, assuming "+end));}
      else if(res.ok){out=await res.json();off=f.size;}
      else return log("FAIL at "+off+": HTTP "+res.status+" "+(await res.text()).slice(0,200));
      document.getElementById("bar").style.width=Math.round(off/f.size*100)+"%";}
    log("3. DONE: "+JSON.stringify(out));
    log("4. Verify: open the link, confirm the file plays, then check Drive shows the file under the Shared Drive (owner = the drive, not you).");
    log("   "+(out.webViewLink||("https://drive.google.com/file/d/"+out.id+"/view")));
  }catch(e){log("FAIL: "+e.message);}
}
</script></body></html>
